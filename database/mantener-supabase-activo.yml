name: Mantener Supabase activo

on:
  schedule:
    # Cada 3 días a las 9:00 UTC (deja margen frente al límite de 7 días)
    - cron: "0 9 */3 * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar tabla_horarios para generar actividad
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://txryvlkvkxzjsubilcmc.supabase.co/rest/v1/tabla_horarios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
